name: Check and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: Open-Timelog-Windows-x64
          path: release/Open Timelog-win32-x64/
